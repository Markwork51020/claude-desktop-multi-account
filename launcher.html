<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Claude Multi</title>
<style>
  :root { --bg:#1f1e1d; --card:#262523; --fg:#ecebe6; --mut:#9b9890; --line:#34332f; --acc:#d97757; --ok:#7fb069; --warn:#e0b04f; --bad:#e06c5a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px "Segoe UI","Microsoft YaHei",system-ui,sans-serif; user-select:none; }
  body { display:flex; flex-direction:column; }
  #list { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; }
  .card:hover { border-color:#4a4844; }
  .row { display:flex; align-items:center; gap:10px; padding:10px 12px; }
  .av { width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:600; font-size:16px; flex:none; }
  .nm { flex:1; min-width:0; }
  .nm b { display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .nm span { display:block; color:var(--mut); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .nm span.on { color:var(--ok); }
  .btn { border:0; border-radius:9px; padding:7px 12px; font:inherit; font-size:13px; cursor:pointer; background:var(--acc); color:#fff; flex:none; }
  .sec { background:#34332f; color:var(--fg); }
  .more { background:none; color:var(--mut); font-size:18px; padding:4px 6px; }
  .more:hover { color:var(--fg); }
  .lim { display:none; padding:0 12px 12px 60px; }
  .lim.on { display:block; }
  .bar { display:flex; align-items:center; gap:8px; font-size:12.5px; margin-top:6px; }
  .bar .k { width:52px; color:var(--mut); }
  .bar .tr { flex:1; height:6px; background:#34332f; border-radius:3px; overflow:hidden; }
  .bar .fl { height:100%; border-radius:3px; }
  .bar .v { width:38px; text-align:right; }
  .at { color:var(--mut); font-size:11.5px; margin-top:6px; }
  #add { margin:0 14px 14px; padding:11px; border-radius:12px; border:1.5px dashed #4a4844; background:none; color:var(--mut); font:inherit; cursor:pointer; }
  #add:hover { color:var(--fg); border-color:var(--mut); }
  #warn { display:none; background:#4a2a22; color:#f2c3b3; padding:10px 14px; margin:14px 14px 0; border-radius:10px; font-size:13px; }
  #modal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.55); }
  #modal.on { display:flex; }
  .box { width:330px; background:#262523; border:1px solid var(--line); border-radius:14px; padding:20px; }
  .box h3 { margin:0 0 12px; font-size:16px; font-weight:600; }
  .box input { width:100%; padding:9px 11px; border-radius:9px; border:1px solid #3a3935; background:#1b1a19; color:var(--fg); font:inherit; outline:none; }
  .box input:focus { border-color:var(--acc); }
  .act { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
</style>
</head>
<body>
<div id="warn" data-t="noClaudeBanner"></div>
<div id="list"></div>
<button id="add" data-t="addAccount"></button>
<div id="modal"><div class="box">
  <h3 id="mt"></h3><input id="mi" maxlength="40">
  <div class="act"><button class="btn sec" id="mc" data-t="cancel"></button><button class="btn" id="mo" data-t="done"></button></div>
</div></div>
<script>
  const list = document.getElementById('list'), modal = document.getElementById('modal'), mi = document.getElementById('mi');
  let st = { accounts: [] }, onOk = null;
  const opened = new Set();   // у каких аккаунтов раскрыты лимиты
  const T = api.strings;
  document.documentElement.lang = T.locale;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T[el.dataset.t]; });

  const when = t => new Date(t).toLocaleString(T.locale, { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const pct = v => (typeof v === 'number' ? Math.round(v) : 0);
  const tone = v => v >= 90 ? 'var(--bad)' : v >= 70 ? 'var(--warn)' : 'var(--ok)';

  function bar(name, v) {
    const el = document.createElement('div'); el.className = 'bar';
    const k = document.createElement('span'); k.className = 'k'; k.textContent = name;
    const tr = document.createElement('div'); tr.className = 'tr';
    const fl = document.createElement('div'); fl.className = 'fl'; fl.style.width = Math.min(pct(v), 100) + '%'; fl.style.background = tone(pct(v));
    tr.append(fl);
    const n = document.createElement('span'); n.className = 'v'; n.textContent = pct(v) + '%';
    el.append(k, tr, n);
    return el;
  }

  function card(a, main) {
    const key = main ? 'main' : a.id, u = main ? st.mainUsage : a.usage;
    const c = document.createElement('div'); c.className = 'card';
    const r = document.createElement('div'); r.className = 'row';
    const av = document.createElement('div'); av.className = 'av'; av.style.background = main ? '#d97757' : a.color;
    av.textContent = main ? '★' : (a.name.trim()[0] || '?').toUpperCase();
    const nm = document.createElement('div'); nm.className = 'nm';
    const b = document.createElement('b'); b.textContent = main ? T.main : a.name;
    nm.append(b);
    if (!main) {
      const s = document.createElement('span');
      if (a.waiting) { s.textContent = T.waiting; s.className = 'on'; }
      else {
        s.textContent = a.lastOpened ? T.lastLogin.replace('{date}', when(a.lastOpened)) : T.neverOpened;
        if (a.running) s.className = 'on';
      }
      nm.append(s);
    }
    const w = document.createElement('span');
    w.textContent = u ? `${T.week} ${pct(u.sd)}% · ${T.fiveHour} ${pct(u.fh)}%` : T.noLimits;
    nm.append(w);
    const go = document.createElement('button'); go.className = 'btn'; go.textContent = T.open;
    go.onclick = e => { e.stopPropagation(); api.send('open', key); };
    const sh = document.createElement('button'); sh.className = 'btn sec';
    sh.textContent = opened.has(key) ? T.hideLimits : T.showLimits;
    sh.onclick = e => { e.stopPropagation(); opened.has(key) ? opened.delete(key) : opened.add(key); render(); };
    r.append(av, nm, go, sh);
    if (!main) {
      const m = document.createElement('button'); m.className = 'btn more'; m.textContent = '⋯'; m.title = T.more;
      m.onclick = e => { e.stopPropagation(); api.send('menu', a.id); };
      r.append(m);
      c.oncontextmenu = e => { e.preventDefault(); api.send('menu', a.id); };
    }
    r.ondblclick = () => api.send('open', key);
    const lim = document.createElement('div'); lim.className = 'lim' + (opened.has(key) ? ' on' : '');
    const at = document.createElement('div'); at.className = 'at';
    if (u) { at.textContent = T.limitsAt.replace('{date}', when(u.t)); lim.append(bar(T.week, u.sd), bar(T.fiveHour, u.fh), at); }
    else { at.textContent = T.noLimits; lim.append(at); }
    c.append(r, lim);
    return c;
  }
  function render() {
    list.replaceChildren(card({}, true), ...st.accounts.map(a => card(a, false)));
    document.getElementById('warn').style.display = st.hasClaude === false ? 'block' : 'none';
  }
  function ask(title, value, ok) {
    document.getElementById('mt').textContent = title;
    mi.value = value; onOk = ok; modal.classList.add('on'); setTimeout(() => { mi.focus(); mi.select(); }, 30);
  }
  function close(ok) { modal.classList.remove('on'); const f = onOk; onOk = null; if (ok && f) f(mi.value); }
  document.getElementById('mo').onclick = () => close(true);
  document.getElementById('mc').onclick = () => close(false);
  mi.onkeydown = e => { if (e.key === 'Enter') close(true); if (e.key === 'Escape') close(false); };
  document.getElementById('add').onclick = () => ask(T.newAccount, T.accountName.replace('{n}', st.accounts.length + 2), v => api.send('add', v));
  api.onState(s => { st = s; render(); });
  api.onAskRename(id => { const a = st.accounts.find(x => x.id === id); if (a) ask(T.rename, a.name, v => api.send('rename', id, v)); });
  setInterval(() => api.send('refresh'), 5000);
</script>
</body>
</html>
